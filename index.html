<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEFLINK – 店舗マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --panel: #1a1d27; --card: #22263a; --border: #2e3248;
    --text: #e8eaf0; --muted: #7a7f9a;
    --accent-red: #ff4d6d; --accent-teal: #00c9a7; --accent-gold: #f5a623;
    --pill-bg: #1e2235;
  }
  body { font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  /* Header */
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--border); z-index:1000; flex-shrink:0; }
  .logo { font-family:'Space Mono',monospace; font-size:15px; font-weight:700; letter-spacing:2px; color:var(--accent-gold); }
  .logo span { color:var(--text); }
  .header-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .refresh-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.15s; font-family:'Noto Sans JP',sans-serif; }
  .refresh-btn:hover { color:var(--text); border-color:var(--accent-teal); }
  .refresh-btn.spinning .icon { display:inline-block; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .status-dot { width:7px; height:7px; border-radius:50%; background:#666; flex-shrink:0; }
  .status-dot.ok { background:var(--accent-teal); box-shadow:0 0 6px var(--accent-teal); }
  .status-dot.err { background:var(--accent-red); }

  /* Filter */
  .filter-bar { display:flex; gap:8px; padding:8px 16px; overflow-x:auto; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; scrollbar-width:none; z-index:999; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-pill { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; background:var(--pill-bg); border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:500; white-space:nowrap; cursor:pointer; transition:all 0.18s ease; user-select:none; font-family:'Noto Sans JP',sans-serif; }
  .filter-pill:hover { border-color:var(--accent-teal); color:var(--text); }
  .filter-pill.active { background:var(--accent-teal); border-color:var(--accent-teal); color:#0f1117; font-weight:700; }
  .filter-pill .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }

  /* Layout */
  .main { display:flex; flex:1; overflow:hidden; position:relative; }
  #map { flex:1; z-index:1; }
  .leaflet-tile { filter:brightness(0.85) saturate(0.7) hue-rotate(185deg); }

  /* Side Panel */
  .side-panel { width:300px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; transform:translateX(-100%); transition:transform 0.28s cubic-bezier(0.4,0,0.2,1); position:absolute; top:0; left:0; bottom:0; z-index:100; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .side-panel.open { transform:translateX(0); }
  .panel-header { display:flex; align-items:flex-start; gap:12px; padding:16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); z-index:10; }
  .store-icon { width:48px; height:48px; border-radius:12px; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; border:1px solid var(--border); }
  .panel-title h2 { font-size:15px; font-weight:700; line-height:1.3; }
  .category-badge { display:inline-flex; align-items:center; gap:4px; margin-top:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; background:var(--card); border:1px solid var(--border); }
  .store-address { display:flex; align-items:center; gap:4px; margin-top:6px; font-size:11px; color:var(--muted); }
  .close-btn { margin-left:auto; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
  .close-btn:hover { color:var(--text); border-color:var(--text); }

  .panel-section { padding:14px 16px; border-bottom:1px solid var(--border); }
  .panel-section h3 { font-size:11px; color:var(--muted); font-weight:500; margin-bottom:10px; letter-spacing:0.5px; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .info-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .info-card .label { font-size:10px; color:var(--muted); margin-bottom:4px; }
  .info-card .value { font-size:13px; font-weight:600; line-height:1.3; }

  /* Reactions */
  .reaction-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 16px; }
  .reaction-btn { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; transition:all 0.2s ease; user-select:none; font-family:'Noto Sans JP',sans-serif; }
  .reaction-btn .emoji { font-size:22px; }
  .reaction-btn .rlabel { font-size:12px; font-weight:600; }
  .reaction-btn .rcount { font-size:11px; color:var(--muted); }
  .reaction-btn.hoshii.active,.reaction-btn.hoshii:hover { border-color:var(--accent-red); background:rgba(255,77,109,0.12); color:var(--accent-red); }
  .reaction-btn.kininaru.active,.reaction-btn.kininaru:hover { border-color:var(--accent-teal); background:rgba(0,201,167,0.1); color:var(--accent-teal); }
  .reaction-btn.loading { opacity:0.5; pointer-events:none; }

  /* Stats Badge */
  .stats-badge { position:fixed; bottom:20px; right:20px; background:rgba(15,17,23,0.92); border:1px solid var(--border); border-radius:14px; padding:10px 14px; display:flex; gap:16px; align-items:center; z-index:500; backdrop-filter:blur(8px); box-shadow:0 4px 20px rgba(0,0,0,0.5); }
  .stat-item { text-align:center; }
  .stat-item .num { font-family:'Space Mono',monospace; font-size:16px; font-weight:700; color:var(--accent-gold); display:block; }
  .stat-item .num.teal { color:var(--accent-teal); }
  .stat-item .lbl { font-size:10px; color:var(--muted); display:block; margin-top:1px; }
  .stat-divider { width:1px; height:30px; background:var(--border); }

  /* Loading overlay */
  .loading-overlay { position:fixed; inset:0; background:rgba(15,17,23,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2000; gap:16px; }
  .loading-overlay.hidden { display:none; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent-teal); border-radius:50%; animation:spin 0.8s linear infinite; }
  .loading-overlay p { color:var(--muted); font-size:13px; }

  /* Error toast */
  .toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--accent-red); color:#fff; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:3000; transition:transform 0.3s ease; pointer-events:none; }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>

  <div style="font-size:12px;color:var(--muted);margin-left:4px;">– 店舗マップ</div>
  <div class="header-right">
    <div class="status-dot" id="statusDot"></div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadStores()">
      <span class="icon">↺</span> 更新
    </button>
  </div>
</header>

<div class="filter-bar" id="filterBar"></div>

<div class="main">
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <div class="store-icon" id="panelIcon">🍽️</div>
      <div class="panel-title">
        <h2 id="panelName">店舗名</h2>
        <div class="category-badge" id="panelBadge"><span>●</span><span id="panelCat">カテゴリ</span></div>
        <div class="store-address">📍 <span id="panelAddr">住所</span></div>
      </div>
      <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-section">
      <h3>店舗情報</h3>
      <div class="info-grid">
        <div class="info-card"><div class="label">最寄駅</div><div class="value" id="infoStation">—</div></div>
        <div class="info-card"><div class="label">従業員数</div><div class="value" id="infoStaff">—</div></div>
        <div class="info-card"><div class="label">公開中求人</div><div class="value" id="infoJobs">—</div></div>
        <div class="info-card"><div class="label">マッチング実績</div><div class="value" id="infoMatch">—</div></div>
        <div class="info-card"><div class="label">最新募集日</div><div class="value" id="infoDate">—</div></div>
        <div class="info-card"><div class="label">企業名</div><div class="value" id="infoCompany">—</div></div>
      </div>
    </div>
    <div class="panel-section" style="border-bottom:none;"><h3>リアクション</h3></div>
    <div class="reaction-grid">
      <button class="reaction-btn hoshii" id="btnHoshii" onclick="react('hoshii')">
        <span class="emoji">❤️</span>
        <span class="rlabel">働きたい！</span>
        <span class="rcount" id="countHoshii">0人</span>
      </button>
      <button class="reaction-btn kininaru" id="btnKininaru" onclick="react('kininaru')">
        <span class="emoji">👀</span>
        <span class="rlabel">気になる</span>
        <span class="rcount" id="countKininaru">0人</span>
      </button>
    </div>
  </div>
  <div id="map"></div>
</div>

<div class="stats-badge">
  <div class="stat-item"><span class="num" id="statTotal">—</span><span class="lbl">掲載店舗</span></div>
  <div class="stat-divider"></div>
  <div class="stat-item"><span class="num teal" id="statHoshii">—</span><span class="lbl">働きたい</span></div>
</div>

<script>
// ── カテゴリ定義 ───────────────────────────────────────────
const CATEGORIES = [
  { id:'all',      label:'すべて',         emoji:'🗺️', color:'#7a7f9a' },
  { id:'french',   label:'フレンチ',       emoji:'🥂', color:'#a78bfa' },
  { id:'italian',  label:'イタリアン',     emoji:'🍕', color:'#f97316' },
  { id:'chinese',  label:'中華',           emoji:'🥟', color:'#eab308' },
  { id:'western',  label:'洋食',           emoji:'🍖', color:'#3b82f6' },
  { id:'izakaya',  label:'居酒屋',         emoji:'🍶', color:'#10b981' },
  { id:'steak',    label:'鉄板・ステーキ', emoji:'🥩', color:'#ef4444' },
  { id:'yakiniku', label:'焼肉',           emoji:'🔥', color:'#f59e0b' },
  { id:'hotel',    label:'ホテル/旅館',    emoji:'🏨', color:'#06b6d4' },
  { id:'sushi',    label:'寿司',           emoji:'🍣', color:'#ec4899' },
  { id:'ramen',    label:'ラーメン',       emoji:'🍜', color:'#84cc16' },
];
const catMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

// ── State ─────────────────────────────────────────────────
let stores = [];
let activeFilter = 'all';
let currentStore = null;
let leafletMarkers = [];
let userReactions = JSON.parse(localStorage.getItem('cheflink_reactions') || '{}');

// ── Map ───────────────────────────────────────────────────
const map = L.map('map', { center:[35.673,139.727], zoom:13, zoomControl:false });
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
map.on('click', closePanel);

// ── Filter Bar ────────────────────────────────────────────
const filterBar = document.getElementById('filterBar');
CATEGORIES.forEach(cat => {
  const pill = document.createElement('button');
  pill.className = 'filter-pill' + (cat.id === 'all' ? ' active' : '');
  pill.dataset.id = cat.id;
  pill.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.emoji} ${cat.label}`;
  pill.onclick = () => setFilter(cat.id);
  filterBar.appendChild(pill);
});

function setFilter(id) {
  activeFilter = id;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
  renderMarkers();
}

// ── Load Stores from GAS ──────────────────────────────────
async function loadStores(silent = false) {
  if (!silent) showLoading(true);
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  try {
    if (!GAS_URL || GAS_URL === 'YOUR_GAS_DEPLOY_URL_HERE') {
      // デモモード：サンプルデータで動作
      stores = DEMO_STORES;
      setStatus('ok');
      showToast('⚠️ デモモード：GAS_URLを設定してください', 4000);
    } else {
      const res  = await fetch(GAS_URL);
      const data = await res.json();
      if (data.status !== 'ok') throw new Error(data.message);
      stores = data.stores;
      setStatus('ok');
    }
    renderMarkers();
    updateStats();
    if (currentStore) {
      const updated = stores.find(s => String(s.id) === String(currentStore.id));
      if (updated) { currentStore = updated; updateReactionUI(updated); }
    }
  } catch (err) {
    setStatus('err');
    if (!silent) showToast('❌ データの取得に失敗しました');
    console.error(err);
  } finally {
    showLoading(false);
    btn.classList.remove('spinning');
  }
}

// ── POST reaction to GAS ──────────────────────────────────
async function postReaction(storeId, type, delta) {
  if (!GAS_URL || GAS_URL === 'YOUR_GAS_DEPLOY_URL_HERE') return; // デモ時はスキップ
  await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ store_id: storeId, type, delta }),
    headers: { 'Content-Type': 'application/json' }
  });
}

// ── Markers ───────────────────────────────────────────────
function renderMarkers() {
  leafletMarkers.forEach(m => map.removeLayer(m));
  leafletMarkers = [];

  const filtered = activeFilter === 'all' ? stores : stores.filter(s => s.category === activeFilter);
  filtered.forEach(store => {
    const color = catMap[store.category]?.color || '#7a7f9a';
    const el = document.createElement('div');
    el.style.cssText = `width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid rgba(255,255,255,0.3);cursor:pointer;box-shadow:0 0 0 3px ${color}44;transition:transform 0.15s;`;
    el.onmouseenter = () => el.style.transform = 'scale(1.6)';
    el.onmouseleave = () => el.style.transform = 'scale(1)';

    const marker = L.marker([Number(store.lat), Number(store.lng)], {
      icon: L.divIcon({ html: el, className:'', iconSize:[16,16], iconAnchor:[8,8] })
    });
    marker.on('click', e => { e.originalEvent.stopPropagation(); openPanel(store); });
    marker.addTo(map);
    leafletMarkers.push(marker);
  });
}

// ── Panel ─────────────────────────────────────────────────
function openPanel(store) {
  currentStore = store;
  const cat   = catMap[store.category] || catMap['all'];
  document.getElementById('panelIcon').textContent = cat.emoji;
  document.getElementById('panelName').textContent = store.name;
  document.getElementById('panelCat').textContent  = cat.label;
  document.getElementById('panelBadge').querySelector('span').style.color = cat.color;
  document.getElementById('panelAddr').textContent    = store.address;
  document.getElementById('infoStation').textContent  = store.station  || '—';
  document.getElementById('infoStaff').textContent    = store.staff    || '—';
  document.getElementById('infoJobs').textContent     = store.jobs     || '—';
  document.getElementById('infoMatch').textContent    = store.match_count || '—';
  document.getElementById('infoDate').textContent     = store.latest_date  || '—';
  document.getElementById('infoCompany').textContent  = store.company  || '—';
  updateReactionUI(store);
  document.getElementById('sidePanel').classList.add('open');
}
function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  currentStore = null;
}

// ── Reactions ─────────────────────────────────────────────
async function react(type) {
  if (!currentStore) return;
  const key     = `${currentStore.id}_${type}`;
  const already = userReactions[key];
  const delta   = already ? -1 : 1;

  // 楽観的UI更新
  currentStore[type] = Math.max(0, (Number(currentStore[type]) || 0) + delta);
  if (already) delete userReactions[key];
  else userReactions[key] = true;
  localStorage.setItem('cheflink_reactions', JSON.stringify(userReactions));
  updateReactionUI(currentStore);
  updateStats();

  // ローディング状態
  const btn = document.getElementById(type === 'hoshii' ? 'btnHoshii' : 'btnKininaru');
  btn.classList.add('loading');

  try {
    await postReaction(currentStore.id, type, delta);
  } catch (err) {
    // 失敗時はロールバック
    currentStore[type] = Math.max(0, currentStore[type] - delta);
    if (already) userReactions[key] = true;
    else delete userReactions[key];
    localStorage.setItem('cheflink_reactions', JSON.stringify(userReactions));
    updateReactionUI(currentStore);
    showToast('❌ リアクションの保存に失敗しました');
  } finally {
    btn.classList.remove('loading');
  }
}

function updateReactionUI(store) {
  document.getElementById('countHoshii').textContent  = (store.hoshii   || 0) + '人';
  document.getElementById('countKininaru').textContent = (store.kininaru || 0) + '人';
  document.getElementById('btnHoshii').classList.toggle('active',   !!userReactions[`${store.id}_hoshii`]);
  document.getElementById('btnKininaru').classList.toggle('active', !!userReactions[`${store.id}_kininaru`]);
}

// ── Stats ─────────────────────────────────────────────────
function updateStats() {
  const filtered    = activeFilter === 'all' ? stores : stores.filter(s => s.category === activeFilter);
  const totalHoshii = stores.reduce((a, s) => a + (Number(s.hoshii) || 0), 0);
  document.getElementById('statTotal').textContent  = filtered.length;
  document.getElementById('statHoshii').textContent = totalHoshii;
}

// ── UI helpers ────────────────────────────────────────────
function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('hidden', !v); }
function setStatus(s) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + s;
}
let toastTimer;
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ── デモ用サンプルデータ（GAS未設定時に使用） ────────────
